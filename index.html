<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pizza Form</title>
</head>
<body>

    <h1>Pizza Ordering Form</h1>

    <form action="#" method="post">

        <fieldset>
            <legend><strong>Contact Information</strong></legend>

            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
        </fieldset>

        <br>

        <fieldset>
            <legend><strong>Select Pizza Size</strong></legend>

            <label for="size">Pizza Size:</label>
            <select id="size" name="size" required>
                <option value="">Select Size</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
                <option value="xlarge">XLarge</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend><strong>Select Sauce</strong></legend>

            <input type="radio" id="marinara" name="sauce" value="marinara" required>
            <label for="marinara">Marinara</label><br>

            <input type="radio" id="ranch" name="sauce" value="ranch">
            <label for="ranch">Ranch</label><br>

            <input type="radio" id="none" name="sauce" value="none">
            <label for="none">No Sauce</label>
        </fieldset>

        <br>

        <fieldset>
            <legend><strong>Select Toppings</strong></legend>

            <input type="checkbox" id="pepperoni" name="toppings" value="pepperoni">
            <label for="pepperoni">Pepperoni</label>

            <input type="checkbox" id="sausage" name="toppings" value="sausage">
            <label for="sausage">Sausage</label><br>

            <input type="checkbox" id="mushrooms" name="toppings" value="mushrooms">
            <label for="mushrooms">Mushrooms</label>

            <input type="checkbox" id="pineapple" name="toppings" value="pineapple">
            <label for="pineapple">Pineapple</label><br>

            <input type="checkbox" id="peppers" name="toppings" value="peppers">
            <label for="peppers">Peppers</label>

            <input type="checkbox" id="onions" name="toppings" value="onions">
            <label for="onions">Onions</label>
        </fieldset>

        <br>

        <fieldset>
            <legend><strong>Additional Instructions</strong></legend>

            <textarea name="instructions" rows="4" cols="30">Add instructions</textarea>
        </fieldset>

        <br>

        <input type="submit" value="Submit">

    </form>

    <br><br>

    <h2>List of My Favorite Games</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Developer</th>
                <th>Title</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="3">Bungie</td>
                <td>Halo</td>
                <td>2001</td>
            </tr>
            <tr>
                <td>Halo 2</td>
                <td>2004</td>
            </tr>
            <tr>
                <td>Halo 3</td>
                <td>2007</td>
            </tr>
            <tr>
                <td>Mojang</td>
                <td>Minecraft</td>
                <td>2011</td>
            </tr>
            <tr>
                <td colspan="3">Total Games Listed: 4</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
